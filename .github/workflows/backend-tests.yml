name: backend-tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Assert production inputs are self-contained
        # The MSFT Historical P/E production path must not depend on the
        # git-ignored research/ tree. A clean CI checkout never has it.
        run: |
          test ! -e research/experiments/aapl-historical-pe-poc/contract/msft_validation \
            || (echo "MSFT production inputs must not live under research/" && exit 1)
          for f in daily_prices.json eps_diluted_concept.json \
                   filing_acceptance_evidence.json q4_evidence_records.json; do
            test -f "data/historical_pe/MSFT/$f" || { echo "missing data/historical_pe/MSFT/$f"; exit 1; }
          done

      - name: Run Historical P/E tests
        run: python -m pytest tests/test_historical_pe.py tests/test_msft_historical_pe.py tests/test_msft_production_reproducibility.py -v

      # test_browser_smoke.py and test_web_api.py import fastapi/uvicorn/playwright,
      # which are not declared in requirements.txt. They are excluded here so this
      # workflow matches the project's declared backend dependency set.
      - name: Run backend test suite
        run: python -m pytest tests/ -q --ignore=tests/test_browser_smoke.py --ignore=tests/test_web_api.py