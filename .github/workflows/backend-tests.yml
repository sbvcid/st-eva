name: backend-tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Assert production inputs are self-contained
        run: |
          test ! -e research/experiments/aapl-historical-pe-poc/contract/msft_validation \
            || (echo "MSFT production inputs must not live under research/" && exit 1)
      - name: test_archive_isolation.py
        run: python -m pytest tests/test_archive_isolation.py -q --tb=line -rf
      - name: test_authority_taxonomy_persistence.py
        run: python -m pytest tests/test_authority_taxonomy_persistence.py -q --tb=line -rf
      - name: test_core_registry.py
        run: python -m pytest tests/test_core_registry.py -q --tb=line -rf
      - name: test_evidence_query_knowledge_state.py
        run: python -m pytest tests/test_evidence_query_knowledge_state.py -q --tb=line -rf
      - name: test_ingestion_cross_company.py
        run: python -m pytest tests/test_ingestion_cross_company.py -q --tb=line -rf
      - name: test_material_findings.py
        run: python -m pytest tests/test_material_findings.py -q --tb=line -rf
      - name: test_registry_identity_331.py
        run: python -m pytest tests/test_registry_identity_331.py -q --tb=line -rf
      - name: test_reverse_requirements_wiring.py
        run: python -m pytest tests/test_reverse_requirements_wiring.py -q --tb=line -rf
      - name: test_sec_provenance_schema.py
        run: python -m pytest tests/test_sec_provenance_schema.py -q --tb=line -rf
      - name: test_source_type_preservation_329.py
        run: python -m pytest tests/test_source_type_preservation_329.py -q --tb=line -rf
