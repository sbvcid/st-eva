name: backend-tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Build frontend
        working-directory: web/frontend
        run: |
          npm ci
          npm run build

      - name: Assert production inputs are self-contained
        run: |
          test ! -e research/experiments/aapl-historical-pe-poc/contract/msft_validation \
            || (echo "MSFT production inputs must not live under research/" && exit 1)
          for f in daily_prices.json eps_diluted_concept.json \
                   filing_acceptance_evidence.json q4_evidence_records.json; do
            test -f "data/historical_pe/MSFT/$f" || { echo "missing data/historical_pe/MSFT/$f"; exit 1; }
          done

      - name: Run archive isolation tests
        run: python -m pytest tests/test_archive_isolation.py -v --tb=line --reruns 2 --reruns-delay 10

      - name: Verify no unverified-authorized third-party data re-added
        run: python scripts/check_unauthorized_data_precommit.py

      - name: Run web API tests
        run: python -m pytest tests/test_web_api.py -v --tb=line --reruns 2 --reruns-delay 10

      - name: Run backend test suite
        run: |
          python -m pytest tests/ -q --tb=line \
            --ignore=tests/test_browser_smoke.py \
            --ignore=tests/test_archive_isolation.py \
            --ignore=tests/test_web_api.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Build frontend
        working-directory: web/frontend
        run: |
          npm ci
          npm run build

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Verify frontend build output
        run: |
          test -f web/frontend/dist/index.html || { echo "frontend build produced no index.html"; exit 1; }

      - name: Run browser smoke tests
        run: python -m pytest tests/test_browser_smoke.py -v --reruns 2 --reruns-delay 15
