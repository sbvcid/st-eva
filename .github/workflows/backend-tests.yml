name: backend-tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # requirements.txt is the core CLI runtime contract and is installed
      # unchanged. requirements-test.txt carries the web-layer and browser-test
      # dependencies so the core environment stays minimal.
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Assert production inputs are self-contained
        # The MSFT Historical P/E production path must not depend on the
        # git-ignored research/ tree. A clean CI checkout never has it.
        run: |
          test ! -e research/experiments/aapl-historical-pe-poc/contract/msft_validation \
            || (echo "MSFT production inputs must not live under research/" && exit 1)
          for f in daily_prices.json eps_diluted_concept.json \
                   filing_acceptance_evidence.json q4_evidence_records.json; do
            test -f "data/historical_pe/MSFT/$f" || { echo "missing data/historical_pe/MSFT/$f"; exit 1; }
          done

      - name: Run backend test suite
        run: python -m pytest tests/ -q --ignore=tests/test_browser_smoke.py

  browser:
    # Real-browser end-to-end tests. They need a built frontend and a Chromium
    # install, and they fetch live market/EDGAR data, so they run as a separate
    # job with a longer allowance.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Build frontend
        # web/app.py serves web/frontend/dist; the browser tests drive the real UI.
        working-directory: web/frontend
        run: |
          npm ci
          npm run build

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Verify frontend build output
        run: |
          test -f web/frontend/dist/index.html || { echo "frontend build produced no index.html"; exit 1; }

      # These tests run real analyses against live SEC/market endpoints. Retry
      # transient upstream slowness; the tests are not excluded from CI.
      - name: Run browser smoke tests
        run: python -m pytest tests/test_browser_smoke.py -v --reruns 2 --reruns-delay 15